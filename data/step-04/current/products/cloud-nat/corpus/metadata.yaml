version: 1
name: corpus
created_at: '2026-04-09T02:38:37+00:00'
updated_at: '2026-04-09T02:38:38+00:00'
commands:
  list_sources: know list sources --key corpus
  sync: know sync --key corpus
  export: know export --key corpus
sources:
- type: site
  id: site-docs-root
  title: https://docs.cloud.google.com/nat/docs
  created_at: '2026-04-09T02:38:37+00:00'
  updated_at: '2026-04-09T02:38:37+00:00'
  update_command: know sync site https://docs.cloud.google.com/nat/docs --key corpus
    --compact
  delete_command: know del --key corpus site-docs-root
  config:
    url: https://docs.cloud.google.com/nat/docs
    max_depth: 1
    max_pages: 0
    compact_output: true
- type: site
  id: site-docs-reference
  title: https://docs.cloud.google.com/nat/docs/apis
  created_at: '2026-04-09T02:38:38+00:00'
  updated_at: '2026-04-09T02:38:38+00:00'
  update_command: know sync site https://docs.cloud.google.com/nat/docs/apis --key
    corpus --compact
  delete_command: know del --key corpus site-docs-reference
  config:
    url: https://docs.cloud.google.com/nat/docs/apis
    max_depth: 1
    max_pages: 0
    compact_output: true
